<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reel prompt wizard</title>
<style>
:root{--bg:#f6f3ee;--ink:#1d1b19;--mut:#6a645c;--card:#fffdf9;--line:#d9d2c7;--acc:#0b5d4b;--accink:#fff;--chip:#ebe5da}
@media (prefers-color-scheme:dark){:root{--bg:#161412;--ink:#f1ece4;--mut:#a79f93;--card:#201d1a;--line:#38332d;--acc:#6fd3b4;--accink:#0d1f1a;--chip:#2b2723}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next",Avenir,"Segoe UI",system-ui,sans-serif;padding:16px 16px 120px;max-width:640px;margin-inline:auto}
h1{font-size:22px;margin:8px 0 2px;letter-spacing:-.01em}
p.sub{margin:0 0 18px;color:var(--mut);font-size:14px}
label{display:block;font-weight:600;font-size:14px;margin:16px 0 6px}
input,textarea{width:100%;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:84px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:7px 13px;font:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:var(--accink);border-color:var(--acc)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:10px;max-width:640px;margin-inline:auto}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--acc);color:var(--accink);cursor:pointer}
.btn.alt{background:var(--chip);color:var(--ink);flex:0 0 auto;padding:14px 18px}
details{margin-top:22px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600;font-size:14px}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Menlo,monospace;color:var(--mut);margin:10px 0 0;max-height:50vh;overflow:auto}
.warn{color:#b3261e;font-size:13px;margin-top:6px;display:none}
</style></head><body>
<h1>Reel prompt wizard</h1>
<p class="sub">Fill what you know. Copy. Paste into ChatGPT. Empty fields become "pick a default and say so".</p>

<label for="purpose">Purpose of this reel (what does this vendor need right now?)</label>
<textarea id="purpose" placeholder="e.g. Bakery wants walk-ins for Diwali sweet boxes this week"></textarea>
<div class="warn" id="pw">Purpose drives the whole script. Add one line.</div>

<label for="vendor">Vendor / brand</label><input id="vendor" placeholder="Name + what they sell">
<label for="audience">Audience</label><input id="audience" placeholder="e.g. families within 5 km, 25-45">
<label>On-screen language</label>
<div class="chips" data-f="language" data-one="1"><button class="chip" aria-pressed="true">Hinglish</button><button class="chip">Hindi</button><button class="chip">English</button><button class="chip">Marathi</button></div>
<label>Duration (seconds)</label>
<div class="chips" data-f="duration" data-one="1"><button class="chip">12</button><button class="chip" aria-pressed="true">18</button><button class="chip">25</button><button class="chip">35</button></div>
<label>Tone</label>
<div class="chips" data-f="tone"><button class="chip" aria-pressed="true">warm</button><button class="chip">funny</button><button class="chip">urgent</button><button class="chip">premium</button><button class="chip">emotional</button><button class="chip">no-nonsense</button></div>
<label for="palette">Palette / brand colors</label><input id="palette" placeholder="e.g. #1B1B1B, #FF6B00, #F5F0E6 (or: choose for me)">
<label>Visual style</label>
<div class="chips" data-f="style" data-one="1"><button class="chip" aria-pressed="true">flat vector, bold shapes</button><button class="chip">paper-cut collage</button><button class="chip">hand-drawn doodle</button><button class="chip">3D clay</button><button class="chip">retro print</button></div>
<label for="cta">Call to action</label><input id="cta" placeholder="e.g. Visit Shop 4, MG Road. Order on WhatsApp.">
<label for="facts">Real facts allowed (prices, offers, numbers, address)</label>
<textarea id="facts" placeholder="Only things that are true. Leave empty = no numbers in the video."></textarea>
<label for="notes">Extra notes</label><textarea id="notes" placeholder="Must-include words, things to avoid"></textarea>

<details><summary>Preview prompt</summary><pre id="prev"></pre></details>
<div class="bar"><button class="btn alt" id="reset">Reset</button><button class="btn" id="copy">Copy prompt</button></div>

<script>
const TEMPLATE = "# ROLE\nYou are the full production crew for ONE vertical reel (1080x1920, 30 fps), made with the Custom Hyper engine. You work in ONE pass: plan, generate assets, write spec, run text gates, render, deliver. No see-fix loops.\n\n# BRIEF (from the user)\n- Purpose of this reel: {{PURPOSE}}\n- Vendor / brand: {{VENDOR}}\n- Audience: {{AUDIENCE}}\n- Language of on-screen text: {{LANGUAGE}}\n- Duration target: {{DURATION}} seconds\n- Tone: {{TONE}}\n- Palette / brand colors: {{PALETTE}}\n- Visual style: {{STYLE}}\n- Call to action: {{CTA}}\n- Real facts you may use (use no others; never invent stats or quotes): {{FACTS}}\n- Extra notes: {{NOTES}}\n\n# STEP 0 - ENGINE (skip any part already done)\n1. If folder `custom-hyper/` is missing: clone https://github.com/toshuu/custom-hyper (GitHub workspace). Else skip.\n2. If `node_modules/` is missing: run `npm install`. Else skip. Do not run the test suite.\n3. Read, in order: `AGENTS.md`, `agent/capabilities.json`, `docs/AGENT_API.md`, `docs/HYPERSPEC.md`, and the closest file in `specs/`. Use ONLY block types, fields and commands that these files list. Never guess JSON syntax.\n4. If `scripts/slice_atlas.py` is missing: write it. Behavior: read atlas.json, cut each sheet into a uniform cols x rows grid (row-major, 1-based), turn the key color (sampled from the sheet corners, or `key`) into transparency, trim each cell to its art plus 4 px, save `<out>/<id>.png`, write `<out>/atlas.out.json` with final w/h. Flipbook entries: same, with one shared crop box for all frames, saved as `<id>_00.png`, `<id>_01.png` ... Warn, never crash, on empty or clipped cells.\n\n# STEP 1 - SCRIPT\nFirst state in 2 lines: the PRIMARY goal of this reel for this vendor, and the one action the viewer should take. Then write the voice script.\n- Sound like a real person talking, not an ad. Short lines. Plain words in {{LANGUAGE}}.\n- Hook in the first line (pattern break). One promise. Proof beats only from the given facts. End with the CTA.\n- One idea per line. Each line = one beat. Fit {{DURATION}} seconds.\n\n# STEP 2 - VISUAL PLAN (one table, one row per beat)\nColumns: beat id | script line | start-end seconds | visual idea | asset kind | motion.\nAsset kinds, in order of preference:\n- `shape`: rectangles, circles, lines, arrows, bars, simple icons, text. Use the engine's native shapes. \n- `rig`: an object split into separate sprite PARTS, animated by engine motion (example: scale = beam, two pans, fulcrum as 4 sprites; beam rotates, pans move; heavier side drops). This is the default way to get \"animated\" visuals. Do NOT make GIFs for this.\n- `sprite`: one still object from a sprite sheet (decor, butterfly, splash, icon, props).\n- `hero`: one large still image, generated alone (not on a sheet).\n- `bg`: background plate, generated alone.\n- `flipbook`: a few frames of a loop on a sheet. Use only if rig cannot do it.\nMap every line to a visual that SHOWS the meaning (metaphor allowed). No beat is text-only.\nWrite the plan to `specs/<slug>.plan.md`.\n\nSVG / DRAWING LIMITS: never draw people, faces, hands, animals, logos, or detailed objects with vector code. Vector code is ONLY for geometric shapes, charts, arrows, frames, simple icons. Anything illustrative goes to image generation.\n\n# STEP 3 - ASSETS (batch everything; generate ALL before writing the spec)\n## 3a. Plan the atlas BEFORE generating\nWrite `assets/<slug>/atlas.json` first (format in `scripts/slice_atlas.py`): each sheet's file name, cols, rows, key color, and every cell: `cell` number (row-major, 1 = top-left), `id`, `role`. Flipbooks: `\"flipbook\":[cell numbers]`. Never ask the image model for coordinates and never measure pixels by hand; the grid IS the manifest.\n## 3b. Sheet rules\n- Group by style and size. Max 9 cells per sheet (3x3), or 6 (3x2). One style per sheet. Put tiny and medium things on sheets; put hero and bg alone.\n- Write one STYLE LOCK sentence (medium, line weight, shading, palette hex codes) and paste it unchanged into every image prompt.\n- Each image prompt says: \"ONE image, a strict grid of C columns x R rows of EQUAL cells, filled left to right then top to bottom. Solid flat pure KEYCOLOR background across the whole image (a color not used in any art). Exactly one subject per cell, centered, at most 70% of the cell, clear empty margin on all sides, nothing crossing cell borders, no shadows on the background, no grid lines, no text, no letters, no logos.\" Then list: \"Cell 1: ...\", \"Cell 2: ...\".\n- Pick KEYCOLOR = #00FF00, or #FF00FF if the art contains green.\n- Rig parts: draw each part alone, upright, neutral pose, one part per cell.\n- No text inside any image. All text is engine text.\n## 3c. Handoff\nSave each generated sheet to `assets/<slug>/sheets/`. If you cannot access the generated image file from your workspace, STOP here and tell the user exactly: \"Upload sheet-1.png, hero-1.png ...\" (list names). Wait for the upload. This is the only allowed pause.\n## 3d. Slice\nRun `python3 scripts/slice_atlas.py assets/<slug>/atlas.json assets/<slug>/sheets assets/<slug>/sprites`. Read `atlas.out.json` for final sizes. If a WARN says a sprite is empty, replace that visual with a `shape` visual; do not regenerate.\n\n# STEP 4 - SPEC (one file: `specs/<slug>.json`)\nHard rules. Obey every one.\n1. TRACK CONTINUITY (the slideshow validator): BEFORE rendering, include at least one persistent shared track element that spans multiple beats (at minimum a ground layer plus one persistent chrome or character layer such as progress bar, ticker, mascot, or recurring object). It must keep living across beats with changing pose/position/scale/rotation keyframes at every beat boundary. Satisfy the slideshow continuity validator, not just per-scene animation. Overlap layers across beats by 0.5-1.2 s; no hard cut between every beat.\n2. CONTRAST: before writing text layers, declare 2-3 approved text/background pairs from the palette, each with contrast ratio >= 4.5:1 (WCAG). Use only declared pairs. Never white on yellow, orange, light green or any light color; never light gray on white. Text over an image or busy area gets a solid plate (opacity >= 0.85) in a declared pair. Display text >= 64 px; one short idea per screen; readable in under 2 s.\n3. NEWLINES: never put the two characters backslash+n inside a text string unless the engine docs say a block supports it. Prefer one text layer per line, or let `fit` / wrapping do it. In JSON a line break is a single `\\n` escape, never `\\\\n`.\n4. Assets: use `assets/<slug>/sprites/*.png` at the sizes in `atlas.out.json`. Scale proportionally; never stretch. Keep sprites inside the 1080x1920 safe area (60 px margins).\n5. Motion: eased (`power3.out`, `back.out`), never linear. Every sprite layer moves for its whole life (float, drift, rotate). Rigs: animate parts together with the same timing.\n6. Text must fit its box: use `fit` on every constrained text block.\n7. Real facts only. Respect the duration.\n\n# STEP 5 - TEXT GATES (no pixels, no vision)\nRun, in this order:\n1. `node -e \"const s=require('fs').readFileSync('specs/<slug>.json','utf8');if(s.includes(String.fromCharCode(92,92,110)))throw new Error('double-escaped newline');JSON.parse(s)\"`\n2. `node src/cli.mjs lint specs/<slug>.json`\n3. `node src/cli.mjs check specs/<slug>.json`\nIf a gate prints an error, fix exactly what it names (one fix pass), re-run the gates once, continue. Warnings: act only if they concern continuity, contrast, or text fit. Do NOT render stills. Do NOT look at images of the result. Do NOT iterate on aesthetics.\n\n# STEP 6 - RENDER AND DELIVER\nRun `node src/cli.mjs render specs/<slug>.json` (full size; or via the `Render Spec` workflow with the repo-relative spec path). When it finishes, deliver the MP4 and stop. Do not re-open, re-probe, preview, or re-render it. Final message: MP4 path, spec path, plan path, duration, render time. Nothing else.\n\n# OUTPUT ORDER\nShow the user: goal (2 lines) -> script -> visual plan table -> atlas plan -> then work silently through the steps -> final delivery message.\n";
const F=["purpose","vendor","audience","palette","cta","facts","notes"];
const DEF="(not given - choose a sensible default and state it in one line)";
const $=id=>document.getElementById(id);
function chipVal(f){return [...document.querySelectorAll(`.chips[data-f=${f}] .chip[aria-pressed=true]`)].map(b=>b.textContent).join(", ")}
function build(){
  const v={};F.forEach(k=>v[k]=$(k).value.trim()||DEF);
  ["language","duration","tone","style"].forEach(k=>v[k]=chipVal(k)||DEF);
  v.facts=$("facts").value.trim()||"none - use no numbers or claims";
  return TEMPLATE.replace(/\{\{(\w+)\}\}/g,(m,k)=>v[k.toLowerCase()]??m);
}
function refresh(){$("prev").textContent=build();try{localStorage.setItem("reelwiz",JSON.stringify(save()))}catch(e){}}
function save(){const o={};F.forEach(k=>o[k]=$(k).value);["language","duration","tone","style"].forEach(k=>o[k]=chipVal(k));return o}
document.querySelectorAll(".chips").forEach(c=>c.addEventListener("click",e=>{
  const b=e.target.closest(".chip");if(!b)return;
  if(c.dataset.one)c.querySelectorAll(".chip").forEach(x=>x.setAttribute("aria-pressed","false"));
  b.setAttribute("aria-pressed",c.dataset.one?"true":String(b.getAttribute("aria-pressed")!=="true"));refresh()}));
F.forEach(k=>$(k).addEventListener("input",refresh));
try{const s=JSON.parse(localStorage.getItem("reelwiz")||"null");if(s){F.forEach(k=>$(k).value=s[k]||"");
 ["language","duration","tone","style"].forEach(k=>{const set=(s[k]||"").split(", ");document.querySelectorAll(`.chips[data-f=${k}] .chip`).forEach(b=>b.setAttribute("aria-pressed",String(set.includes(b.textContent))))})}}catch(e){}
$("copy").onclick=async()=>{
  $("pw").style.display=$("purpose").value.trim()?"none":"block";
  const t=build();
  try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove()}
  $("copy").textContent="Copied";setTimeout(()=>$("copy").textContent="Copy prompt",1400)};
$("reset").onclick=()=>{try{localStorage.removeItem("reelwiz")}catch(e){}location.reload()};
refresh();
</script></body></html>
