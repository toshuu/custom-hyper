name: Render Spec

on:
  push:
    paths:
      - 'specs/poverty-in-india-reframed.json'
      - 'specs/spotify-every-mood.json'
      - 'specs/shiv-sweet-marts-diwali.json'
      - 'specs/motion-designer-showreel.json'
      - 'assets/shiv-sweet-marts-diwali/**'
      - '.github/workflows/render-spec.yml'
  workflow_dispatch:
    inputs:
      spec:
        description: Repository-relative HyperSpec JSON path
        required: true
        default: specs/shiv-sweet-marts-diwali.json
      stills_at:
        description: Review still seconds
        required: false
        default: '1.0,2.8,5.8,8.8,11.8,14.8,17.2'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    env:
      SPEC: ${{ inputs.spec || 'specs/shiv-sweet-marts-diwali.json' }}
      STILLS_AT: ${{ inputs.stills_at || '1.0,2.8,5.8,8.8,11.8,14.8,17.2' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Prepare Pexels photo assets
        if: env.SPEC == 'specs/spotify-every-mood.json'
        run: |
          set -euo pipefail
          mkdir -p assets/spotify /tmp/spotify-src
          curl -fL --retry 3 'https://images.pexels.com/photos/7241298/pexels-photo-7241298.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/hook.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/4127610/pexels-photo-4127610.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/happy.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/8820970/pexels-photo-8820970.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/sad.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/1181367/pexels-photo-1181367.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/focus.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/5899284/pexels-photo-5899284.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/party.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/36714306/pexels-photo-36714306.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/chill.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/7129206/pexels-photo-7129206.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/travel.jpg
          curl -fL --retry 3 'https://images.pexels.com/photos/17680322/pexels-photo-17680322.jpeg?auto=compress&cs=tinysrgb&w=1800' -o /tmp/spotify-src/late-night.jpg
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageEnhance
          from pathlib import Path
          src=Path('/tmp/spotify-src')
          dst=Path('assets/spotify')
          focus={
            'hook.jpg':(0.50,0.50),'happy.jpg':(0.63,0.50),'sad.jpg':(0.65,0.50),
            'focus.jpg':(0.35,0.50),'party.jpg':(0.60,0.50),'chill.jpg':(0.55,0.50),
            'travel.jpg':(0.52,0.50),'late-night.jpg':(0.50,0.50)
          }
          for name,point in focus.items():
            im=Image.open(src/name).convert('RGB')
            im=ImageOps.fit(im,(1080,1920),method=Image.Resampling.LANCZOS,centering=point)
            im=ImageEnhance.Contrast(im).enhance(1.08)
            im=ImageEnhance.Color(im).enhance(1.10)
            im.save(dst/name.replace('.jpg','.png'),optimize=True)
          from PIL import ImageDraw, ImageFilter
          import math, random
          random.seed(17)
          def cover(name, base, accent, mode):
            im=Image.new('RGB',(480,480),base)
            d=ImageDraw.Draw(im,'RGBA')
            if mode=='sun':
              d.ellipse((80,55,400,375),fill=accent)
              for i in range(8):
                d.arc((35+i*9,35+i*9,445-i*9,445-i*9),start=195,end=345,fill=(245,255,245,170),width=5)
              for x,y,r in [(85,90,18),(390,115,13),(105,380,22),(390,360,17)]: d.ellipse((x-r,y-r,x+r,y+r),fill=(255,255,255,150))
            elif mode=='focus':
              for i in range(10):
                x=35+i*45
                d.line((x,25,x,455),fill=(180,245,220,85),width=2)
                d.line((25,x,455,x),fill=(180,245,220,85),width=2)
              d.ellipse((110,110,370,370),outline=accent,width=24)
              d.ellipse((185,185,295,295),fill=(245,255,248,220))
            else:
              for i in range(22):
                x=random.randint(20,460); y=random.randint(10,470); h=random.randint(22,75)
                d.line((x,y,x-8,y+h),fill=(180,205,255,150),width=random.randint(2,5))
              d.ellipse((95,80,385,370),fill=(70,85,150,90),outline=accent,width=8)
            im=im.filter(ImageFilter.GaussianBlur(0.35))
            im.save(dst/name,optimize=True)
          cover('cover-feelgood.png','#10271A','#1ED760','sun')
          cover('cover-focus.png','#101D2D','#76B9FF','focus')
          cover('cover-sad.png','#17142D','#A8A5FF','rain')
          PY
          cat > assets/spotify/SOURCES.md <<'EOF'
          # Photo asset credits
          All photos are downloaded from Pexels pages marked Free / Free to use. They are fetched at workflow time and cropped to 1080x1920 before rendering.
          - Eren Li — https://www.pexels.com/photo/ethnic-male-teenager-using-tablet-and-listening-to-music-in-headphones-at-home-7241298/
          - Gustavo Fring — https://www.pexels.com/photo/cheerful-woman-listening-to-music-and-dancing-4127610/
          - Khoa Võ — https://www.pexels.com/photo/sad-young-woman-with-clasped-hands-on-a-rainy-day-8820970/
          - Christina Morillo — https://www.pexels.com/photo/photography-of-woman-listening-to-music-1181367/
          - Kaboompics — https://www.pexels.com/photo/smiling-woman-dancing-in-the-living-room-5899284/
          - Vitaly Gariev — https://www.pexels.com/photo/young-woman-relaxing-by-window-with-music-36714306/
          - Michael Burrows — https://www.pexels.com/photo/indian-man-listening-to-song-from-earbud-in-town-7129206/
          - Vi Tran — https://www.pexels.com/photo/young-man-using-headphones-and-listening-to-music-17680322/
          EOF
      - name: Verify authored image assets
        if: env.SPEC == 'specs/shiv-sweet-marts-diwali.json'
        run: node scripts/verify_spec_assets.mjs "$SPEC"
      - name: Validate and plan
        run: |
          case "$SPEC" in
            specs/*.json) test -f "$SPEC" ;;
            *) echo "spec must be a repository-relative path under specs/"; exit 1 ;;
          esac
          node src/cli.mjs lint "$SPEC"
          node src/cli.mjs check "$SPEC"
          node src/cli.mjs plan "$SPEC" --out out/compiled-plan.json
      - name: Render review stills and full-resolution MP4
        run: |
          node src/cli.mjs stills "$SPEC" --at "$STILLS_AT" --scale 0.5 --out out/review
          node src/cli.mjs render "$SPEC" --out out/render.mp4
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.env.SPEC)); const st=fs.statSync("out/render.mp4"); fs.writeFileSync("out/metadata.json", JSON.stringify({width:s.canvas.w,height:s.canvas.h,fps:s.canvas.fps,frames:s.duration*s.canvas.fps,duration:s.duration,size:st.size,codec:"H.264",audio:"none"},null,2))'
          python - <<'PY'
          from PIL import Image, ImageDraw
          from pathlib import Path
          files=sorted(Path("out/review").glob("*.png"))
          if not files: raise SystemExit("No review stills found")
          thumbs=[]
          for p in files:
              im=Image.open(p).convert("RGB")
              im.thumbnail((270,480))
              tile=Image.new("RGB",(290,520),"#111")
              tile.paste(im,((290-im.width)//2,10))
              ImageDraw.Draw(tile).text((10,495),p.stem,fill="white")
              thumbs.append(tile)
          cols=3
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new("RGB",(cols*290,rows*520),"#222")
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*290,(i//cols)*520))
          sheet.save("out/contact-sheet.jpg",quality=92)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: custom-hyper-render-delivery
          path: |
            out/review/
            out/render.mp4
            out/compiled-plan.json
            out/metadata.json
            out/contact-sheet.jpg
            assets/spotify/
            assets/shiv-sweet-marts-diwali/
          if-no-files-found: error
          retention-days: 14
