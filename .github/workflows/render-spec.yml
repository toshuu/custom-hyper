name: Render Spec

on:
  push:
    paths:
      - 'specs/poverty-in-india-reframed.json'
      - 'specs/spotify-every-mood.json'
  workflow_dispatch:
    inputs:
      spec:
        description: Repository-relative HyperSpec JSON path
        required: true
        default: specs/spotify-every-mood.json
      stills_at:
        description: Review still seconds
        required: false
        default: '1.5,4.5,7.5,10.5,14,17,21,25,28'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Validate and plan
        env:
          SPEC: ${{ inputs.spec || 'specs/spotify-every-mood.json' }}
        run: |
          case "$SPEC" in
            specs/*.json) test -f "$SPEC" ;;
            *) echo "spec must be a repository-relative path under specs/"; exit 1 ;;
          esac
          node src/cli.mjs lint "$SPEC"
          node src/cli.mjs check "$SPEC"
          node src/cli.mjs plan "$SPEC" --out out/compiled-plan.json
      - name: Render review stills and full-resolution MP4
        env:
          SPEC: ${{ inputs.spec || 'specs/spotify-every-mood.json' }}
          STILLS_AT: ${{ inputs.stills_at || '1.5,4.5,7.5,10.5,14,17,21,25,28' }}
        run: |
          node src/cli.mjs stills "$SPEC" --at "$STILLS_AT" --scale 0.5 --out out/review
          node src/cli.mjs render "$SPEC" --out out/render.mp4
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.env.SPEC)); const st=fs.statSync("out/render.mp4"); fs.writeFileSync("out/metadata.json", JSON.stringify({width:s.canvas.w,height:s.canvas.h,fps:s.canvas.fps,frames:s.duration*s.canvas.fps,duration:s.duration,size:st.size,codec:"H.264"},null,2))'
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          from pathlib import Path
          files=sorted(Path("out/review").glob("*.png"))
          if not files: raise SystemExit("No review stills found")
          thumbs=[]
          for p in files:
              im=Image.open(p).convert("RGB")
              im.thumbnail((270,480))
              tile=Image.new("RGB",(290,520),"#111")
              tile.paste(im,((290-im.width)//2,10))
              ImageDraw.Draw(tile).text((10,495),p.stem,fill="white")
              thumbs.append(tile)
          cols=3
          rows=(len(thumbs)+cols-1)//cols
          sheet=Image.new("RGB",(cols*290,rows*520),"#222")
          for i,im in enumerate(thumbs): sheet.paste(im,((i%cols)*290,(i//cols)*520))
          sheet.save("out/contact-sheet.jpg",quality=92)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: custom-hyper-render
          path: |
            out/review/
            out/render.mp4
            out/compiled-plan.json
            out/metadata.json
            out/contact-sheet.jpg
          if-no-files-found: error
          retention-days: 14
