name: Render Spec

on:
  push:
    paths:
      - 'specs/*.json'
  workflow_dispatch:
    inputs:
      spec:
        description: Repository-relative HyperSpec JSON path
        required: true
        default: specs/minimal-3s.json
      stills_at:
        description: Review still seconds
        required: false
        default: '1,4,8'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Select and validate spec
        id: select-spec
        env:
          SPEC_INPUT: ${{ inputs.spec }}
        run: |
          if [ -n "$SPEC_INPUT" ]; then
            SPEC="$SPEC_INPUT"
          else
            SPEC="$(jq -r '[.head_commit.added[]?, .head_commit.modified[]?] | .[]' "$GITHUB_EVENT_PATH" | grep -E '^specs/[^/]+\.json
          fi
          case "$SPEC" in
            specs/*.json) test -f "$SPEC" ;;
            *) echo "No valid spec found. Pass a specs/*.json path or commit one."; exit 1 ;;
          esac
          echo "spec=$SPEC" >> "$GITHUB_OUTPUT"
      - name: Validate and plan
        env:
          SPEC: ${{ steps.select-spec.outputs.spec }}
        run: |
          node src/cli.mjs lint "$SPEC"
          node src/cli.mjs check "$SPEC"
          node src/cli.mjs plan "$SPEC" --out out/compiled-plan.json
      - name: Render review stills and proxy MP4
        env:
          SPEC: ${{ steps.select-spec.outputs.spec }}
          STILLS_AT: ${{ inputs.stills_at || '1,4,8' }}
        run: |
          node src/cli.mjs stills "$SPEC" --at "$STILLS_AT" --scale 0.5 --out out/review
          node src/cli.mjs render "$SPEC" --scale 0.5 --out out/render.mp4
          ffprobe -v error -show_entries stream=width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of json out/render.mp4 > out/metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: custom-hyper-render
          path: |
            out/review/
            out/render.mp4
            out/compiled-plan.json
            out/metadata.json
          if-no-files-found: error
          retention-days: 14
