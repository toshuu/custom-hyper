name: Render Spec

on:
  push:
    paths:
      - 'specs/poverty-in-india-reframed.json'
      - 'specs/spotify-every-mood.json'
  workflow_dispatch:
    inputs:
      spec:
        description: Repository-relative HyperSpec JSON path
        required: true
        default: specs/poverty-in-india-reframed.json
      stills_at:
        description: Review still seconds
        required: false
        default: '3,7.5,12.5,17.5,22.5,27.5,30.5'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.20.0
          cache: npm
      - run: npm ci
      - name: Validate and plan
        env:
          SPEC: ${{ inputs.spec || 'specs/poverty-in-india-reframed.json' }}
        run: |
          case "$SPEC" in
            specs/*.json) test -f "$SPEC" ;;
            *) echo "spec must be a repository-relative path under specs/"; exit 1 ;;
          esac
          node src/cli.mjs lint "$SPEC"
          node src/cli.mjs check "$SPEC"
          node src/cli.mjs plan "$SPEC" --out out/compiled-plan.json
      - name: Render review stills and proxy MP4
        env:
          SPEC: ${{ inputs.spec || 'specs/poverty-in-india-reframed.json' }}
          STILLS_AT: ${{ inputs.stills_at || '3,7.5,12.5,17.5,22.5,27.5,30.5' }}
        run: |
          node src/cli.mjs stills "$SPEC" --at "$STILLS_AT" --scale 0.5 --out out/review
          node src/cli.mjs render "$SPEC" --scale 0.5 --out out/render.mp4
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.env.SPEC)); const st=fs.statSync("out/render.mp4"); fs.writeFileSync("out/metadata.json", JSON.stringify({width:s.canvas.w/2,height:s.canvas.h/2,fps:s.canvas.fps,frames:s.duration*s.canvas.fps,duration:s.duration,size:st.size},null,2))'
      - uses: actions/upload-artifact@v4
        with:
          name: custom-hyper-render
          path: |
            out/review/
            out/render.mp4
            out/compiled-plan.json
            out/metadata.json
          if-no-files-found: error
          retention-days: 14
