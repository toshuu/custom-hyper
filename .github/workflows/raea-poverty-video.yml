name: Render Poverty in India with RAEA

on:
  push:
    branches: [main]
    paths:
      - "raea/poverty-in-india.tsx"
      - ".github/workflows/raea-poverty-video.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: poverty-in-india-raea
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install system media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg curl libvulkan1 mesa-vulkan-drivers vulkan-tools
      - name: Install RAEA
        run: |
          curl -fsSL https://raea.io/install | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.raea/bin" >> "$GITHUB_PATH"
      - name: Download documentary photographs
        run: |
          set -euo pipefail
          mkdir -p media/poverty
          fetch() {
            curl --fail --location --retry 3 --retry-delay 2 \
              --user-agent "RAEADocumentary/1.0 (asset attribution in repo)" "$1" -o "$2"
            test -s "$2"
          }
          fetch "https://commons.wikimedia.org/wiki/Special:FilePath/Dharavi_slum_in_Mumbai_India_August_2009.jpg?width=1800" media/poverty/dharavi-aerial.jpg
          fetch "https://commons.wikimedia.org/wiki/Special:FilePath/Dharavi_Slum.jpg?width=1800" media/poverty/dharavi-street.jpg
          fetch "https://commons.wikimedia.org/wiki/Special:FilePath/Indian_farmer_woman.jpg?width=1800" media/poverty/farmer.jpg
          fetch "https://commons.wikimedia.org/wiki/Special:FilePath/India_-_Sights_%26_Culture_-_33_-_woman_fetching_water.jpg?width=1800" media/poverty/water.jpg
          fetch "https://commons.wikimedia.org/wiki/Special:FilePath/Classroom_in_India.jpg?width=1800" media/poverty/classroom.jpg
          fetch "https://commons.wikimedia.org/wiki/Special:FilePath/A_Street_Vendor_in_India.jpg?width=1800" media/poverty/vendor.jpg
          mkdir -p public/poverty
          cp media/poverty/* public/poverty/
      - name: Configure software Vulkan for headless CI
        run: |
          set -euo pipefail
          echo "Available Vulkan ICDs:"
          ls -la /usr/share/vulkan/icd.d/
          LVP_ICD="$(find /usr/share/vulkan/icd.d -maxdepth 1 -iname '*lvp*.json' -print -quit)"
          test -n "$LVP_ICD"
          echo "VK_ICD_FILENAMES=$LVP_ICD" >> "$GITHUB_ENV"
          echo "WGPU_BACKEND=vulkan" >> "$GITHUB_ENV"
          vulkaninfo --summary
      - name: Render review frames with RAEA
        run: |
          mkdir -p out/review
          raea render raea/poverty-in-india.tsx --at 0,150,300,450,600,750,900,1050,1200,1349 -o out/review/
      - name: Render final MP4 with RAEA
        run: raea render raea/poverty-in-india.tsx -o out/poverty-in-india-raea.mp4 --quality master --manifest out/render-manifest.json
      - name: Check output
        run: |
          set -euo pipefail
          test -s out/poverty-in-india-raea.mp4
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,r_frame_rate,nb_frames -show_entries format=duration,size -of json out/poverty-in-india-raea.mp4 | tee out/metadata.json
          raea check out/poverty-in-india-raea.mp4 --manifest out/render-manifest.json -o out/quality-check.json
      - uses: actions/upload-artifact@v4
        with:
          name: poverty-in-india-raea-master
          path: |
            out/poverty-in-india-raea.mp4
            out/render-manifest.json
            out/metadata.json
            out/quality-check.json
            out/review/*
          if-no-files-found: error
          retention-days: 14
